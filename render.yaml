services:
  - type: web
    name: cung-tuyen-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run db:schema && npm run db:seed && npm start
    envVars:
      - key: CLIENT_API_KEY
        sync: false
      - key: CLIENT_API_SECRET
        sync: false
      - key: DRIVER_API_KEY
        sync: false
      - key: DRIVER_API_SECRET
        sync: false
      - key: AUTH_TOKEN_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
    healthCheckPath: /health
